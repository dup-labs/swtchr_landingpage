<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SWTCHR — Editor de PDP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }
      .ProseMirror { min-height: 64px; border: 1px solid #DFE3EC; border-radius: 8px; padding: 9px 12px; font-size: 14px; line-height: 1.5; outline: none; background: #fff; }
      .ProseMirror:focus { border-color: #639BFC; }
      .ProseMirror > * { margin: 0 0 6px; }
      .ProseMirror > *:last-child { margin-bottom: 0; }
      .ProseMirror h1 { font-size: 1.5em; } .ProseMirror h2 { font-size: 1.3em; } .ProseMirror h3 { font-size: 1.12em; }
      .ProseMirror ul, .ProseMirror ol { padding-left: 1.4em; }
      .ProseMirror p.is-editor-empty:first-child::before { content: attr(data-placeholder); color: #8F94A7; float: left; height: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
